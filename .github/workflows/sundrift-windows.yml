name: Sundrift Windows VST3
on:
  push:
    branches: [sundrift-v0.1.2-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Sundrift source
        shell: pwsh
        run: |
          $content = (Get-Content -Raw -Path 'sundrift-source.base64.txt').Trim()
          [System.IO.File]::WriteAllBytes('sundrift-source.zip', [System.Convert]::FromBase64String($content))
          Expand-Archive 'sundrift-source.zip' -DestinationPath 'Sundrift' -Force
      - name: Configure A2-enabled VST3
        shell: pwsh
        run: cmake -S Sundrift -B Sundrift/build -G "Visual Studio 17 2022" -A x64 -DSUNDRIFT_WITH_NAM=ON
      - name: Build release VST3
        shell: pwsh
        run: cmake --build Sundrift/build --config Release --target Sundrift_VST3 --parallel 4
      - name: Locate and package plugin
        shell: pwsh
        run: |
          $bundle = Get-ChildItem Sundrift/build -Recurse -Directory -Filter Sundrift.vst3 | Select-Object -First 1
          if (-not $bundle) { throw "VST3 bundle not found" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $bundle.FullName dist/Sundrift.vst3 -Recurse
          Compress-Archive -Path dist/Sundrift.vst3 -DestinationPath Sundrift-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sundrift-Windows-x64-VST3
          path: Sundrift-Windows-VST3.zip
          if-no-files-found: error
