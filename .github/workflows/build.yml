name: Build Murmur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMURMUR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Engine render test
        shell: bash
        run: |
          if [ -f build/Release/murmur_render_test.exe ]; then build/Release/murmur_render_test.exe; \
          elif [ -f build/murmur_render_test ]; then build/murmur_render_test; \
          else find build -name "murmur_render_test*" -type f -perm -u+x -exec {} \; ; fi

      - name: Validate with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests "build\Murmur_artefacts\Release\VST3\Murmur.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/Murmur_artefacts/Release/VST3/Murmur.vst3 dist/
          if [ -d build/Murmur_artefacts/Release/AU ]; then cp -R build/Murmur_artefacts/Release/AU/Murmur.component dist/; fi
          if [ -d build/Murmur_artefacts/Release/Standalone ]; then cp -R build/Murmur_artefacts/Release/Standalone/* dist/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Murmur-${{ matrix.name }}
          path: dist
