name: Build Murmur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DMURMUR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Engine render test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          build\Release\murmur_render_test.exe | Tee-Object -FilePath reports\render-test.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Plugin test (processor and editor)
        shell: pwsh
        run: |
          build\Release\murmur_plugin_test.exe | Tee-Object -FilePath reports\plugin-test.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: CPU benchmark
        shell: pwsh
        run: build\Release\murmur_bench.exe | Tee-Object -FilePath reports\cpu-windows.txt

      - name: Validate with pluginval
        id: pluginval
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $proc = Start-Process -FilePath .\pluginval\pluginval.exe -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput reports\pluginval-report.txt -RedirectStandardError reports\pluginval-errors.txt `
            -ArgumentList '--strictness-level 5 --validate-in-process --skip-gui-tests --timeout-ms 600000 --validate "build\Murmur_artefacts\Release\VST3\Murmur.vst3"'
          $code = $proc.ExitCode
          Get-Content reports\pluginval-report.txt -Tail 15
          "exit code $code" | Out-File -Append reports\pluginval-report.txt
          exit $code

      - name: Collect plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build\Murmur_artefacts\Release\VST3\Murmur.vst3 dist\
          Copy-Item build\Murmur_artefacts\Release\Standalone\Murmur.exe dist\Murmur-standalone.exe
          Copy-Item -Recurse reports dist\

      # Artifact storage counts against the account quota, so the finished
      # plugin is published to a 'builds' branch instead.
      - name: Publish to the builds branch
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath Murmur-Windows.zip -Force
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds
          git rm -r -q --cached .
          git add -f Murmur-Windows.zip
          git commit -q -m "Windows build $env:GITHUB_SHA"
          git push -f origin builds

  # The Linux ARM64 build is for the planned Raspberry Pi live rig.
  linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build xvfb libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMURMUR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Tests and CPU benchmark
        shell: bash   # runs with pipefail, so a failing test fails the step even through tee
        run: |
          mkdir -p reports
          build/murmur_render_test | tee reports/render-test.txt
          xvfb-run -a build/murmur_plugin_test | tee reports/plugin-test.txt
          build/murmur_bench | tee reports/cpu-linux-arm64.txt

      - name: Publish to the builds-linux-arm64 branch
        run: |
          mkdir -p dist
          cp -R build/Murmur_artefacts/Release/VST3/Murmur.vst3 dist/
          cp build/Murmur_artefacts/Release/Standalone/Murmur dist/Murmur-standalone
          cp -R reports dist/
          tar -czf Murmur-Linux-ARM64.tar.gz -C dist .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds-linux-arm64
          git rm -r -q --cached .
          git add -f Murmur-Linux-ARM64.tar.gz
          git commit -q -m "Linux ARM64 build $GITHUB_SHA"
          git push -f origin builds-linux-arm64
