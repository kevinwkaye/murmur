name: Build Murmur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DMURMUR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Engine render test
        run: build\Release\murmur_render_test.exe

      - name: Validate with pluginval
        id: pluginval
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests "build\Murmur_artefacts\Release\VST3\Murmur.vst3" *> pluginval-report.txt
          $code = $LASTEXITCODE
          # Surface the important lines as annotations so they show on the run summary
          Get-Content pluginval-report.txt | Select-String -Pattern "FAILED|!!!|Starting test|ERROR|Error|crash|Exception" | Select-Object -Last 40 | ForEach-Object { Write-Output "::warning::$($_.Line)" }
          exit $code

      - name: Collect plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build\Murmur_artefacts\Release\VST3\Murmur.vst3 dist\
          Copy-Item build\Murmur_artefacts\Release\Standalone\Murmur.exe dist\Murmur-standalone.exe
          if (Test-Path pluginval-report.txt) { Copy-Item pluginval-report.txt dist\ }

      # Artifact storage counts against the account quota, so the finished
      # plugin is published to a 'builds' branch instead.
      - name: Publish to the builds branch
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath Murmur-Windows.zip -Force
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan builds
          git rm -r -q --cached .
          git add -f Murmur-Windows.zip
          git commit -q -m "Windows build $env:GITHUB_SHA"
          git push -f origin builds
